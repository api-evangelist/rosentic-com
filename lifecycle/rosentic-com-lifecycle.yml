versioning:
  scheme: >-
    Per-artifact semver with no version in any URL path except the REST feed's /v1/ prefix. Four independent
    version lines: the engine image (v1.8.0, 2026-07-10, per changelog; distributed as ghcr.io/rosentic/
    rosentic-engine pinned by digest), the GitHub Action (tags v1.0.0…v1.8.0 with a floating v1 that the
    repo's CLAUDE.md force-moves to every main commit), the rosentic-mcp package (0.2.9 on PyPI, 2026-09-05;
    the docs still say 0.2.2) and the agent card (version 1.0.0, protocolVersion 0.3.0).
  current:
    engine: v1.8.0 (2026-07-10)
    github_action: v1.8.0 tag, v1 floating (newest release 2026-07-10)
    rosentic_mcp: 0.2.9 (2026-09-05)
    agent_card: 1.0.0
    rest_feed: /v1/ (GET /v1/feed/rules)
  policy_published: false
  note: >-
    No versioning policy page exists. The docs never say how long an engine or Action version is supported,
    and the Action's own install instruction ("uses: Rosentic/rosentic-action@v1") resolves to whatever main
    was last pushed, so a consumer cannot pin a released version by following the docs.
