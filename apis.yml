aid: rosentic-com
name: Rosentic
description: >-
  Rosentic is a developer-tools company whose product checks the open branches in a git repository against
  each other before merge, catching the function-signature mismatches, HTTP route contract breaks,
  GraphQL/typed-schema conflicts and Protobuf/gRPC changes that pass CI on every branch individually and
  break main when parallel AI coding agents land together. The engine is deterministic tree-sitter AST
  analysis across 13 languages with no LLM in the scan path, shipped as a GitHub Action that runs on the
  consumer's own runner and as rosentic-mcp on PyPI, a local MCP server and CLI with nine tools. Hosted
  surfaces on api.rosentic.com: Rosentic Remote, an MCP endpoint behind OAuth 2.1 with PKCE and dynamic
  client registration; an A2A 0.3.0 agent card with five skills and a live JSON-RPC endpoint; and a
  Bearer-key REST feed. Detection is free at every tier; paid plans buy stored history and quotas. No
  OpenAPI is published.
