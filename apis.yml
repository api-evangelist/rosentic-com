apis:
- aid: rosentic-com:rosentic-remote-mcp-server
  name: Rosentic Remote MCP Server
  image: https://raw.githubusercontent.com/Rosentic/cursor-plugin/main/assets/logo.png
  description: >-
    Hosted Model Context Protocol endpoint at https://api.rosentic.com/mcp (Streamable HTTP, POST), live
    since 2026-07-23, exposing three read tools over stored scan snapshots — run_status (every lane in a
    run: branch, head, merged or not, sequence position, what is clear to land next), which_lane (which
    lane owns a set of paths per the run manifest) and get_verdict (the recorded gate decision for a commit
    SHA). Every answer carries the scan SHA and its age and returns RESCAN_REQUIRED past the staleness
    window; reads are workspace-scoped and cross-org reads return NOT_FOUND. Access is OAuth 2.1
    authorization-code with PKCE S256 and RFC 7591 dynamic client registration (scope rosentic:remote:read;
    an anonymous tools/list returns HTTP 401 with an RFC 9728 WWW-Authenticate challenge) or a Rosentic API
    key as a Bearer token, so the live tool schemas are auth-gated. The same provider ships rosentic-mcp, a
    local stdio server on PyPI with nine tools, six of them fully offline.
  humanURL: https://rosentic.com/mcp/
  baseURL: https://api.rosentic.com/mcp
  tags:
  - MCP
  - agent-native
  - Merge Safety
  properties:
  - type: MCPServer
    url: mcp/rosentic-com-mcp.yml
  - type: MCPServer
    name: Rosentic Remote endpoint (Streamable HTTP, OAuth 2.1)
    url: https://api.rosentic.com/mcp
  - type: Documentation
    url: https://rosentic.com/mcp/
  - type: OAuthScopes
    url: scopes/rosentic-com-scopes.yml
  - type: Authentication
    url: authentication/rosentic-com-authentication.yml
- aid: rosentic-com:rosentic-a2a-agent
  name: Rosentic A2A Agent
  image: https://raw.githubusercontent.com/Rosentic/cursor-plugin/main/assets/logo.png
  description: >-
    Agent2Agent protocol surface: an agent card served from https://api.rosentic.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, version 1.0.0, streaming true, stateTransitionHistory true; also byte-identical
    at the legacy /.well-known/agent.json) advertising five skills — assess_integration_posture,
    check_conflicts, explain_conflict, list_branches and the key-gated merge_index — served by a live
    JSON-RPC 2.0 endpoint at https://api.rosentic.com/a2a (tasks/get for an unknown id answers "Task not
    found"). Four skills are anonymous on public repositories at 3 requests per hour per IP with a 250MB
    repo cap; a Bearer API key unlocks private repos, higher limits and Merge Index. The skills serve
    STORED scan results produced by the GitHub Action or local MCP; the A2A endpoint does not itself run the
    engine. Graded near-conformant against A2A 1.0.0 (no preferredTransport; legacy authentication block).
  humanURL: https://rosentic.com/docs/
  baseURL: https://api.rosentic.com/a2a
  tags:
  - A2A
  - agent-native
  - Merge Safety
  properties:
  - type: AgentCard
    url: a2a/rosentic-com-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://api.rosentic.com/.well-known/agent-card.json
  - type: RateLimits
    url: rate-limits/rosentic-com-rate-limits.yml
- aid: rosentic-com:rosentic-dashboard-feed-api
  name: Rosentic Dashboard Feed API
  image: https://raw.githubusercontent.com/Rosentic/cursor-plugin/main/assets/logo.png
  description: >-
    The Bearer-key REST surface documented on the orchestrator-integration page for wiring Conductor, Claude
    Squad, LangGraph and other agent orchestrators to a Rosentic workspace: GET /v1/feed/rules returns
    fleet-learned merge-safety rules (id, layer, severity, confidence, category) for prompt injection and
    task routing — documented as "Available Now" — while GET /v1/feed/hotspots (repo risk score and hot
    surfaces) and POST /v1/scan (hosted sibling scan) are documented as Coming Soon, with a published error
    table (400 invalid_request, 401 unauthorized, 403 plan_required, 404 repo_not_found, 408 scan_timeout,
    429 rate_limit_exceeded, 500 internal_error, 503 scan_unavailable). Authentication is a workspace API
    key (ros_live_ prefix, issued once at https://api.rosentic.com/onboard) as Authorization: Bearer. On
    2026-09-19 an anonymous GET of /v1/feed/rules returned the host's generic 404 ({"error":"not_found"})
    rather than the documented 401, so the endpoint could not be confirmed live without a key. No OpenAPI is
    published; the API root https://api.rosentic.com/ answers a JSON descriptor naming auth, share,
    scan-upload, observations and agent-card URLs.
  humanURL: https://rosentic.com/docs/integrations/
  baseURL: https://api.rosentic.com
