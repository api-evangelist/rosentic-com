domain_standard_conformance:
  applicable: false
  note: >-
    Developer tooling / CI has no sector standard (no SCIM, OData, FHIR, OpenRTB, LTI or similar analogue),
    and the scorer's regime map lists none for this sector. Rosentic READS OpenAPI, GraphQL and Protobuf
    contracts as inputs to its engine (detection layers L3a–L3c) but does not itself expose an API in any of
    those shapes. Reward-only check; left empty on purpose.
compliance_program:
  published: false
  evidence: >-
    https://rosentic.com/trust/ (200, 4,771 bytes) is a data-boundary page — "the engine goes to the code,
    the code never goes to the engine", three telemetry tiers (anonymous: names + SHAs hashed on the runner;
    keyed: itemized scan metadata, never source; VPC: nothing leaves) — with no certification, audit report
    or framework named. The 2026-03-24 post "Your code is never stored" adds supply-chain controls (2FA on
    maintainer accounts, image pinned by SHA digest, GITHUB_TOKEN only, no outbound calls from the engine).
    Real security posture, not a compliance program: no Compliance pointer.
