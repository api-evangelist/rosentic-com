discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: api.rosentic.com
  note: >-
    Served from the API host, api.rosentic.com — which is also the hosted MCP host, the OAuth authorization
    server and the A2A JSON-RPC host. The apex rosentic.com is a Next.js catch-all that answers HTTP 200 with
    the same 8,425-byte marketing shell for EVERY unknown path, including both agent-card paths and a
    negative-control path that cannot exist, so nothing on the apex counts. On api.rosentic.com the legacy
    /.well-known/agent.json returns a byte-identical copy of the same card, a negative-control path
    (/.well-known/rosentic-com-negative-control-9c1e4a7b.json) returns the host's real JSON 404
    ({"error":"not_found"}, 21 bytes), and the API root document at https://api.rosentic.com/ names
    agent_card_url https://api.rosentic.com/.well-known/agent.json itself. HEAD on the card path returns 404;
    only GET serves it. Ownership is not in question: provider.organization is "Rosentic" with provider.url
    https://rosentic.com, x-rosentic.github points at github.com/Rosentic/rosentic-action, and the skills
    describe the product the website, llms.txt and PyPI package describe.
