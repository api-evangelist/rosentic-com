summary: >-
  Rosentic has no separate test environment, no test-mode keys and no magic test values — production is the
  sandbox, and the free anonymous tier is the way to try it ("No signup. No API key. No account."). What the
  provider publishes instead is a set of first-party FIXTURE repositories built to break: rosentic-demo
  ("twelve parallel agent branches that each pass CI alone — built to break when combined"; the docs quote
  it as 12 branches, 60 UNSAFE, 6 WARNING, first scan 1.0s), rosentic-demo-fullstack (api, gateway, proto,
  schema, services across the stack), and rosentic-simulate, a script that simulates parallel AI coding
  agents on any real repo to manufacture cross-branch conflicts. Forking a demo repo and adding the one-file
  workflow is the documented 90-second proof.
test_vs_live:
  separate_environment: false
  key_prefixes: 'ros_live_ (workspace API key) — no test-key prefix is published'
  modes: ['anonymous (no key): full detection, nothing stored', 'keyed: adds dashboard history', 'audit vs enforce on the Action: audit posts the report and always passes; enforce blocks merge on conflicts']
  note: Audit mode is the rehearsal switch — new installs start there and the docs say to switch to enforce "when you trust the results".
