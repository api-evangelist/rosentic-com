scopes:
- scope: rosentic:remote:read
  description: >-
    Read access to Rosentic Remote — the hosted MCP tools run_status, which_lane and get_verdict, which answer
    from stored scan snapshots scoped to the caller's workspace. The only scope the authorization server
    advertises and the scope the MCP endpoint's WWW-Authenticate challenge demands.
  resource: https://api.rosentic.com/mcp
  flows: [authorizationCode]
  sources: [well-known/rosentic-com-oauth-authorization-server.json, well-known/rosentic-com-oauth-protected-resource.json, 'MCP 401 WWW-Authenticate: Bearer resource_metadata="https://api.rosentic.com/.well-known/oauth-protected-resource/mcp", scope="rosentic:remote:read"']
  write_scope: none published — the remote surface is read-only
github_oauth_delegation:
  note: >-
    Dashboard sign-in (https://api.rosentic.com/auth/github) is a separate GitHub OAuth app requesting
    read:org read:user user:email (observed in the 302 Location); those are GitHub's scopes, not Rosentic's,
