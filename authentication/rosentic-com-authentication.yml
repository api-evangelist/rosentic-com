  dynamic_client_registration: true
  credential_classes: 4
  headline: >-
    Four ways in, by surface. (1) Rosentic Remote MCP at https://api.rosentic.com/mcp: OAuth 2.1
    authorization-code with PKCE S256 for a public client, dynamic client registration, one scope
    rosentic:remote:read — discovered through the RFC 9728 / RFC 8414 chain the endpoint's 401 points at —
    or a Rosentic API key as a Bearer token. (2) The REST feed and the dashboard-backed MCP tools: a
    workspace API key (ros_live_ prefix) as Authorization: Bearer, issued once at onboarding. (3) The A2A
    agent: anonymous for public repos (3 requests/hour per IP, 250MB repo cap) or Bearer API key for
    private repos and Merge Index. (4) The GitHub Action and the six offline MCP tools: no credential at
    all — "No signup. No API key. No account." No OIDC is served (/.well-known/openid-configuration 404),
    and no OpenAPI declares any of this, so derive-authentication.py had nothing to read.
