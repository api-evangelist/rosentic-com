gaps:
- The A2A card carries its auth in the legacy authentication.schemes[] block rather than securitySchemes/security (see a2a/rosentic-com-a2a.yml deviations).
- The OAuth metadata's resource_documentation and the 401 body's docs_url both point at github.com/Rosentic/rosentic/blob/main/docs/remote.md, which is not publicly readable (404); the readable remote docs are https://rosentic.com/mcp/.
- GET https://api.rosentic.com/v1/feed/rules without a key returns the host's generic 404 ({"error":"not_found"}) rather than the documented 401 unauthorized, so an unauthenticated client cannot tell the endpoint exists.
